aid: buildforever
name: Buildforever
description: BuildForever is a consumer software company building products that feel personal,
  magical, and deeply human. Its first product, Extra (extra.email), is a free AI email app
  for iPhone, Mac, and Gmail that automatically organizes the inbox into smart categories,
  summarizes what matters in a daily digest, cleans up subscriptions and unwanted senders,
  answers natural-language questions about your mail, and drafts replies in your own tone.
  Founded and led by CEO Naveen Gavini (formerly SVP/CPO at Pinterest), BuildForever is
  backed by Abstract Ventures, Felicis, and DST Global, with angel investors including Ben
  Silbermann, Guillermo Rauch, and Paul Buchheit. The company does not currently publish a
  public developer API; this profile captures its consumer product surface and identity.
